name: Update profile cards

on:
  push:
    branches: [main]
    paths:
      - 'data/project-timeline.json'
      - 'assets/mypc.png'
      - 'assets/mypc_wire.png'
      - 'assets/profile-icons/*.svg'
      - 'scripts/**'
      - '.github/workflows/update-profile-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate profile cards
        run: |
          node scripts/render-profile-cards.cjs
          node scripts/render-extra-tech-badges.cjs
          node scripts/render-project-timeline.cjs
      - name: Commit updated cards
        shell: bash
        run: |
          git add -- README.md 'assets/profile-*.svg' 'assets/project-tech-*.svg'
          if git diff --cached --quiet; then
            echo "Cards are already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update profile cards from data"
          git push origin HEAD:main
